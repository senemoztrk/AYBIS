<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYBİS | Kayıt Ol</title>
  <link rel="icon" type="RESİMLER/x-icon" href="RESİMLER/AFET YÖNETİM BİLGİ SİSTEMİ kopyası.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #003366;
      --accent: #00aaff;
      --light-bg: #f0f8ff;
      --white: #ffffff;
      --shadow: 0 10px 30px rgba(0, 85, 170, 0.1);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: var(--light-bg);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 20% 50%, rgba(0, 170, 255, 0.1), transparent 30%),
                  radial-gradient(circle at 80% 70%, rgba(0, 51, 102, 0.1), transparent 30%);
      animation: particlesAnim 15s linear infinite;
    }
    
    .register-container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 2rem;
      background: var(--white);
      border-radius: 15px;
      box-shadow: var(--shadow);
      transform: scale(0.95);
      opacity: 0;
      animation: scaleIn 0.5s ease-out forwards;
      position: relative;
      overflow: hidden;
    }
    
    .register-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(to right, var(--primary), var(--accent));
    }
    
    .logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    
    .logo img {
      height: 200px;
      width: auto;
      transition: transform 0.3s ease;
    }
    
    .logo:hover img {
      transform: rotate(5deg);
    }
    
    h2 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }
    
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .input-group {
      position: relative;
      margin-bottom: 1rem;
    }
    
    .input-group.full-width {
      grid-column: span 2;
    }
    
    .input-group i {
      position: absolute;
      top: 15px;
      left: 15px;
      color: var(--primary);
      transition: all 0.3s ease;
    }
    
    .input-group input, 
    .input-group select,
    .input-group textarea {
      width: 100%;
      padding: 12px 15px 12px 45px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
      background-color: #f9f9f9;
    }
    
    .input-group textarea {
      min-height: 100px;
      resize: vertical;
    }
    
    .input-group input:focus,
    .input-group select:focus,
    .input-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 170, 255, 0.2);
      outline: none;
      background-color: var(--white);
    }
    
    .input-group input:focus + i,
    .input-group select:focus + i,
    .input-group textarea:focus + i {
      color: var(--accent);
      transform: scale(1.1);
    }
    
    /* Select özel stil */
    .input-group select {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23003366' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 15px;
    }
    
    .input-group select:disabled {
      background-color: #f0f0f0;
      opacity: 0.7;
    }
    
    .terms {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 14px;
    }
    
    .terms input {
      margin-right: 8px;
    }
    
    .terms a {
      color: var(--primary);
      text-decoration: none;
    }
    
    .terms a:hover {
      text-decoration: underline;
    }
    
    .register-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, var(--primary), var(--accent));
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    
    .register-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 50%;
      height: 200%;
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(30deg);
      transition: all 0.3s ease;
    }
    
    .register-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 170, 255, 0.3);
    }
    
    .register-btn:hover::after {
      left: 110%;
    }
    
    .login-link {
      text-align: center;
      color: #666;
    }
    
    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    
    .login-link a:hover {
      text-decoration: underline;
    }
    
    /* Animations */
    @keyframes particlesAnim {
      0% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(20px, 20px);
      }
      100% {
        transform: translate(0, 0);
      }
    }
    
    @keyframes scaleIn {
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
    
    /* Password strength meter */
    .password-strength {
      height: 5px;
      background: #eee;
      border-radius: 5px;
      margin-top: 5px;
      overflow: hidden;
      position: relative;
    }
    
    .strength-meter {
      height: 100%;
      width: 0;
      background: #e74c3c;
      transition: all 0.3s ease;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      
      .input-group.full-width {
        grid-column: span 1;
      }
    }
    
    @media (max-width: 576px) {
      .register-container {
        margin: 1rem;
        padding: 1.5rem;
      }
      
      .logo img {
        height: 50px;
      }
      
      .input-group i {
        top: 13px;
      }
    }
  </style>
</head>

    citySelect.addEventListener('change', function() {
      const selectedCity = this.value;
      districtSelect.innerHTML = '<option value="" disabled selected>İlçe</option>';
      
      if (selectedCity && districts[selectedCity]) {
        districtSelect.disabled = false;
        districts[selectedCity].forEach(district => {
          const option = document.createElement('option');
          option.value = district;
          option.textContent = district;
          districtSelect.appendChild(option);
        });
      } else {
        districtSelect.disabled = true;
      }
    });
    
    // Şifre güçlülük göstergesi
    const passwordInput = document.getElementById('password');
    const strengthMeter = document.getElementById('strengthMeter');
    
    passwordInput.addEventListener('input', function() {
      const password = this.value;
      let strength = 0;
      
      // Uzunluk kontrolü
      if (password.length > 7) strength += 25;
      
      // Küçük harf kontrolü
      if (/[a-z]/.test(password)) strength += 25;
      
      // Büyük harf kontrolü
      if (/[A-Z]/.test(password)) strength += 25;
      
      // Sayı/özel karakter kontrolü
      if (/[0-9!@#$%^&*]/.test(password)) strength += 25;
      
      // Göstergenin güncellenmesi
      strengthMeter.style.width = strength + '%';
      
      // Renk değişimi
      if (strength < 50) {
        strengthMeter.style.backgroundColor = '#e74c3c'; // Kırmızı
      } else if (strength < 75) {
        strengthMeter.style.backgroundColor = '#f39c12'; // Turuncu
      } else {
        strengthMeter.style.backgroundColor = '#2ecc71'; // Yeşil
      }
    });
    
    // Form gönderimi
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = this.querySelector('.register-btn');
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Kayıt Olunuyor...';
      submitBtn.disabled = true;
      
      // Simüle edilmiş API isteği
      setTimeout(() => {
        submitBtn.innerHTML = '<i class="fas fa-check"></i> Kayıt Başarılı!';
        
        // Yönlendirme
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      }, 2000);
    });
    
    // Input focus efektleri
    document.querySelectorAll('.input-group input, .input-group select, .input-group textarea').forEach(input => {
      const icon = input.parentElement.querySelector('i');
      
      input.addEventListener('focus', function() {
        icon.style.color = '#00aaff';
        icon.style.transform = 'scale(1.1)';
      });
      
      input.addEventListener('blur', function() {
        icon.style.color = '#003366';
        icon.style.transform = 'scale(1)';
      });
    });
  </script>

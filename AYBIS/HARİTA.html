<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Türkiye Afet Takip Sistemi</title>
  <link rel="icon" type="RESİMLER/x-icon" href="RESİMLER/AFET YÖNETİM BİLGİ SİSTEMİ kopyası.jpg">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --danger-color: #e74c3c;
      --warning-color: #f39c12;
      --success-color: #27ae60;
      --info-color: #2980b9;
      --light-color: #ecf0f1;
      --dark-color: #2c3e50;
      --white: #ffffff;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }
    
    header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: var(--white);
      padding: 1.5rem;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1000;
    }
    
    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    
    header p {
      font-size: 1rem;
      opacity: 0.9;
    }
    
    .container {
      display: flex;
      flex-wrap: wrap;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem;
    }
    
    #map {
      height: 600px;
      flex: 1 1 60%;
      min-width: 300px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      margin: 1rem;
      z-index: 1;
    }
    
    .sidebar {
      flex: 1 1 35%;
      min-width: 300px;
      margin: 1rem;
      max-height: 600px;
      overflow-y: auto;
    }
    
    .disaster-card {
      background-color: var(--white);
      border-radius: 8px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease;
      border-left: 4px solid;
    }
    
    .disaster-card:hover {
      transform: translateY(-3px);
    }
    
    .disaster-card.earthquake {
      border-left-color: var(--danger-color);
    }
    
    .disaster-card.fire {
      border-left-color: var(--warning-color);
    }
    
    .disaster-card.flood {
      border-left-color: var(--info-color);
    }
    
    .disaster-card.landslide {
      border-left-color: var(--success-color);
    }
    
    .disaster-card h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
    }
    
    .disaster-card h3 i {
      margin-right: 0.5rem;
    }
    
    .disaster-card p {
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
    }
    
    .disaster-card .date {
      color: #777;
      font-size: 0.8rem;
    }
    
    .disaster-card .magnitude {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 500;
      font-size: 0.8rem;
      margin-right: 0.5rem;
    }
    
    .earthquake .magnitude {
      background-color: var(--danger-color);
      color: white;
    }
    
    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem;
    }
    
    .filter-btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
    }
    
    .filter-btn i {
      margin-right: 0.3rem;
    }
    
    .filter-btn.active {
      color: white;
    }
    
    .filter-btn.earthquake {
      background-color: rgba(231, 76, 60, 0.2);
      color: var(--danger-color);
    }
    
    .filter-btn.earthquake.active {
      background-color: var(--danger-color);
    }
    
    .filter-btn.fire {
      background-color: rgba(243, 156, 18, 0.2);
      color: var(--warning-color);
    }
    
    .filter-btn.fire.active {
      background-color: var(--warning-color);
    }
    
    .filter-btn.flood {
      background-color: rgba(41, 128, 185, 0.2);
      color: var(--info-color);
    }
    
    .filter-btn.flood.active {
      background-color: var(--info-color);
    }
    
    .filter-btn.landslide {
      background-color: rgba(39, 174, 96, 0.2);
      color: var(--success-color);
    }
    
    .filter-btn.landslide.active {
      background-color: var(--success-color);
    }
    
    .legend {
      padding: 1rem;
      background: white;
      border-radius: 8px;
      box-shadow: var(--shadow);
      position: absolute;
      bottom: 30px;
      right: 30px;
      z-index: 1000;
    }
    
    .legend h4 {
      margin-bottom: 0.5rem;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 0.3rem;
    }
    
    .legend-icon {
      width: 20px;
      height: 20px;
      margin-right: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      
      #map, .sidebar {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>

<header>
  <h1><i class="fas fa-exclamation-triangle"></i> Türkiye Afet Takip Sistemi</h1>
  <p>Son afetler ve depremler gerçek zamanlı olarak haritada gösteriliyor</p>
</header>

<div class="filter-buttons">
  <button class="filter-btn earthquake active" data-type="earthquake">
    <i class="fas fa-quake"></i> Depremler
  </button>
  <button class="filter-btn fire active" data-type="fire">
    <i class="fas fa-fire"></i> Yangınlar
  </button>
  <button class="filter-btn flood active" data-type="flood">
    <i class="fas fa-water"></i> Seller
  </button>
  <button class="filter-btn landslide active" data-type="landslide">
    <i class="fas fa-mountain"></i> Heyelanlar
  </button>
</div>

<div class="container">
  <div id="map"></div>
  <div class="sidebar" id="disasters-list"></div>
</div>

<div class="legend">
  <h4>Gösterge</h4>
  <div class="legend-item">
    <div class="legend-icon"><i class="fas fa-quake" style="color: var(--danger-color);"></i></div>
    <span>Deprem</span>
  </div>
  <div class="legend-item">
    <div class="legend-icon"><i class="fas fa-fire" style="color: var(--warning-color);"></i></div>
    <span>Yangın</span>
  </div>
  <div class="legend-item">
    <div class="legend-icon"><i class="fas fa-water" style="color: var(--info-color);"></i></div>
    <span>Sel</span>
  </div>
  <div class="legend-item">
    <div class="legend-icon"><i class="fas fa-mountain" style="color: var(--success-color);"></i></div>
    <span>Heyelan</span>
  </div>
</div>

<script>
  // Harita başlangıç
  const map = L.map('map').setView([39.0, 35.0], 6);
  
  // Harita katmanı
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> katkıcıları',
    maxZoom: 18,
  }).addTo(map);
  
  // Özel ikonlar oluşturma
  const createCustomIcon = (iconClass, color) => {
    return L.divIcon({
      html: `<div style="background-color: ${color}; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 0 10px rgba(0,0,0,0.3);"><i class="${iconClass}" style="font-size: 16px;"></i></div>`,
      className: 'custom-icon',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });
  };
  
  // Afet ikonları
  const icons = {
    earthquake: createCustomIcon('fas fa-quake', '#e74c3c'),
    fire: createCustomIcon('fas fa-fire', '#f39c12'),
    flood: createCustomIcon('fas fa-water', '#2980b9'),
    landslide: createCustomIcon('fas fa-mountain', '#27ae60')
  };
  
  // Afet verileri
  const disasters = [
    {
      id: 1,
      type: 'landslide',
      title: 'Rize Heyelanı',
      date: '2025-05-01 13:00:00',
      magnitude: 'Büyük',
      location: 'Rize, Ardeşen',
      lat: 41.025513,
      lon: 40.517666,
      description: 'Yamaçtan kopan kaya parçaları ve toprak birikintisinin sürüklendiği köy yolu,ulaşıma kapandı.'
    },
    {
      id: 2,
      type: 'fire',
      title: 'Antalya Orman Yangını',
      date: '2025-05-02 10:00:00',
      magnitude: '50 hektar',
      location: 'Antalya, Manavgat',
      lat: 36.8619,
      lon: 31.2433,
      description: 'Manavgat bölgesinde çıkan orman yangını rüzgarın etkisiyle yayılıyor.'
    },
    {
      id: 3,
      type: 'flood',
      title: 'Kırıkkale Sel Felaketi',
      date: '2025-05-03 08:00:00',
      magnitude: 'Şiddetli',
      location: 'Kırıkkale, Yahşihan',
      lat: 39.8468,
      lon: 33.5153,
      description: 'Şiddetli yağışlar nedeniyle Yahşihan bölgesinde sel baskınları yaşanıyor.'
    },
    {
      id: 4,
      type: 'landslide',
      title: 'Trabzon Heyelanı',
      date: '2025-05-03 10:00:00',
      magnitude: 'Büyük',
      location: 'Trabzon, Maçka',
      lat: 40.9734,
      lon: 39.9397,
      description: 'Maçka bölgesinde şiddetli yağışların tetiklediği heyelan nedeniyle ulaşım kesildi.'
    },
    {
      id: 5,
      type: 'earthquake',
      title: 'İzmir Depremi',
      date: '2025-05-04 04:30:00',
      magnitude: '5.2',
      depth: '7 km',
      location: 'İzmir, Seferihisar',
      lat: 38.1950,
      lon: 26.8375,
      description: 'İzmir\'in Seferihisar ilçesinde orta şiddette deprem meydana geldi.'
    }
  ];
  
  // Haritada işaretçiler ve popuplar
  const markers = {};
  disasters.forEach(disaster => {
    const marker = L.marker([disaster.lat, disaster.lon], {
      icon: icons[disaster.type],
      riseOnHover: true
    }).addTo(map);
    
    marker.bindPopup(`
      <div style="min-width: 200px;">
        <h3 style="margin: 0 0 5px 0; color: ${getColorForType(disaster.type)};">
          <i class="${getIconClassForType(disaster.type)}"></i> ${disaster.title}
        </h3>
        <p><strong>Yer:</strong> ${disaster.location}</p>
        <p><strong>Tarih:</strong> ${formatDate(disaster.date)}</p>
        ${disaster.type === 'earthquake' ? 
          `<p><strong>Büyüklük:</strong> ${disaster.magnitude}</p>
           <p><strong>Derinlik:</strong> ${disaster.depth}</p>` : 
          `<p><strong>Şiddet:</strong> ${disaster.magnitude}</p>`}
        <p>${disaster.description}</p>
      </div>
    `);
    
    markers[disaster.id] = marker;
  });
  
  // Afet kartlarını oluştur
  const disastersList = document.getElementById('disasters-list');
  
  disasters.forEach(disaster => {
    const card = document.createElement('div');
    card.className = `disaster-card ${disaster.type}`;
    card.dataset.id = disaster.id;
    card.dataset.type = disaster.type;
    
    card.innerHTML = `
      <h3><i class="${getIconClassForType(disaster.type)}"></i> ${disaster.title}</h3>
      <p class="date">${formatDate(disaster.date)}</p>
      <p><strong>Yer:</strong> ${disaster.location}</p>
      ${disaster.type === 'earthquake' ? 
        `<p><strong>Büyüklük:</strong> <span class="magnitude">${disaster.magnitude}</span> 
         <strong>Derinlik:</strong> ${disaster.depth}</p>` : 
        `<p><strong>Şiddet:</strong> ${disaster.magnitude}</p>`}
      <p>${disaster.description}</p>
    `;
    
    // Kart tıklandığında haritada merkezle
    card.addEventListener('click', () => {
      map.setView([disaster.lat, disaster.lon], 8);
      markers[disaster.id].openPopup();
    });
    
    disastersList.appendChild(card);
  });
  
  // Filtreleme işlevselliği
  const filterButtons = document.querySelectorAll('.filter-btn');
  const activeFilters = new Set(['earthquake', 'fire', 'flood', 'landslide']);
  
  filterButtons.forEach(button => {
    button.addEventListener('click', () => {
      const type = button.dataset.type;
      
      if (activeFilters.has(type)) {
        activeFilters.delete(type);
        button.classList.remove('active');
      } else {
        activeFilters.add(type);
        button.classList.add('active');
      }
      
      applyFilters();
    });
  });
  
  function applyFilters() {
    // Haritadaki işaretçileri filtrele
    Object.entries(markers).forEach(([id, marker]) => {
      const disaster = disasters.find(d => d.id == id);
      if (activeFilters.has(disaster.type)) {
        map.addLayer(marker);
      } else {
        map.removeLayer(marker);
      }
    });
    
    // Liste kartlarını filtrele
    document.querySelectorAll('.disaster-card').forEach(card => {
      if (activeFilters.has(card.dataset.type)) {
        card.style.display = 'block';
      } else {
        card.style.display = 'none';
      }
    });
  }
  
  // Yardımcı fonksiyonlar
  function getColorForType(type) {
    const colors = {
      earthquake: '#e74c3c',
      fire: '#f39c12',
      flood: '#2980b9',
      landslide: '#27ae60'
    };
    return colors[type] || '#333';
  }
  
  function getIconClassForType(type) {
    const icons = {
      earthquake: 'fas fa-quake',
      fire: 'fas fa-fire',
      flood: 'fas fa-water',
      landslide: 'fas fa-mountain'
    };
    return icons[type] || 'fas fa-exclamation-circle';
  }
  
  function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleString('tr-TR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }
  
  // Gerçek deprem verilerini çek
  fetch("https://api.orhanaydogdu.com.tr/deprem/kandilli/live")
    .then(response => response.json())
    .then(data => {
      if (data.result && data.result.length > 0) {
        data.result.slice(0, 10).forEach(deprem => {
          if (deprem.geojson?.coordinates?.length === 2) {
            const [lon, lat] = deprem.geojson.coordinates;
            
            // Haritaya ekle
            const marker = L.marker([lat, lon], {
              icon: icons.earthquake,
              riseOnHover: true
            }).addTo(map);
            
            marker.bindPopup(`
              <div style="min-width: 200px;">
                <h3 style="margin: 0 0 5px 0; color: ${getColorForType('earthquake')};">
                  <i class="${getIconClassForType('earthquake')}"></i> ${deprem.title}
                </h3>
                <p><strong>Yer:</strong> ${deprem.title.split('(')[0].trim()}</p>
                <p><strong>Tarih:</strong> ${new Date(deprem.date).toLocaleString('tr-TR')}</p>
                <p><strong>Büyüklük:</strong> ${deprem.mag}</p>
                <p><strong>Derinlik:</strong> ${deprem.depth} km</p>
              </div>
            `);
            
            // Listeye ekle
            const card = document.createElement('div');
            card.className = 'disaster-card earthquake';
            card.dataset.type = 'earthquake';
            
            card.innerHTML = `
              <h3><i class="${getIconClassForType('earthquake')}"></i> ${deprem.title}</h3>
              <p class="date">${new Date(deprem.date).toLocaleString('tr-TR')}</p>
              <p><strong>Büyüklük:</strong> <span class="magnitude">${deprem.mag}</span></p>
              <p><strong>Derinlik:</strong> ${deprem.depth} km</p>
            `;
            
            card.addEventListener('click', () => {
              map.setView([lat, lon], 8);
              marker.openPopup();
            });
            
            disastersList.appendChild(card);
          }
        });
      }
    })
    .catch(err => {
      console.error("Deprem verileri alınamadı:", err);
    });
</script>

</body>
</html>

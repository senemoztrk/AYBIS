<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYBİS | Giriş Yap</title>
  <link rel="icon" type="RESİMLER/x-icon" href="RESİMLER/AFET YÖNETİM BİLGİ SİSTEMİ kopyası.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #003366;
      --primary-light: #0055a5;
      --accent: #00aaff;
      --danger: #e74c3c;
      --warning: #f39c12;
      --success: #2ecc71;
      --bg-color: #f8fafc;
      --text-color: #34495e;
      --light-gray: #ecf0f1;
      --dark-gray: #95a5a6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 450px;
      margin: auto;
      padding: 2.5rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 85, 170, 0.1);
      transform: translateY(20px);
      opacity: 0;
      animation: fadeInUp 0.6s ease-out 0.3s forwards;
      position: relaative;
      overflow: hidden;
      z-index: 2;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: linear-gradient(to bottom, var(--primary), var(--accent));
    }
   
    .logo {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 200px; 
  margin-bottom: 1.5rem;
}

.logo img {
  height: 200px; 
  width: auto;
  transition: transform 0.3s ease;
  display: block; 
}

    
    .logo:hover img {
      transform: rotate(5deg);
    }
    
    h2 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 18px;
      transform: translateY(-50%);
      color: var(--primary);
      transition: all 0.3s ease;
    }

    .input-group input {
      width: 100%;
      padding: 14px 20px 14px 50px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
      background-color: #f9f9f9;
    }

    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 170, 255, 0.2);
      outline: none;
      background-color: white;
    }

    .input-group input:focus + i {
      color: var(--accent);
      transform: translateY(-50%) scale(1.1);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 14px;
    }

    .remember-me {
      display: flex;
      align-items: center;
    }

    .remember-me input {
      margin-right: 8px;
      accent-color: var(--primary);
    }

    .forgot-password a {
      color: var(--primary);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .forgot-password a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(to right, var(--primary), var(--primary-light));
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .login-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 50%;
      height: 200%;
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(30deg);
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 85, 170, 0.3);
    }

    .login-btn:hover::after {
      left: 110%;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: var(--dark-gray);
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #ddd;
      margin: 0 10px;
    }

    .social-login {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 1.5rem;
    }

    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      transition: all 0.3s ease;
    }

    .social-btn.google {
      background: #db4437;
    }

    .social-btn.facebook {
      background: #4267B2;
    }

    .social-btn.twitter {
      background: #1DA1F2;
    }

    .social-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .register-link {
      text-align: center;
      color: var(--dark-gray);
    }

    .register-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .register-link a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Animations */
    @keyframes fadeInUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    /* Wave Background */
    .wave-bg {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23003366" fill-opacity="0.08" d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,181.3C960,181,1056,235,1152,234.7C1248,235,1344,181,1392,154.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom center;
      background-size: cover;
      z-index: 1;
      animation: waveAnim 8s ease-in-out infinite alternate;
    }

    @keyframes waveAnim {
      0% {
        transform: translateY(0) scaleY(1);
      }
      100% {
        transform: translateY(-20px) scaleY(1.05);
      }
    }

    /* Responsive */
    @media (max-width: 576px) {
      .login-container {
        margin: 1rem;
        padding: 1.5rem;
      }

      .logo img {
        height: 60px;
      }

      h2 {
        font-size: 1.5rem;
      }

      .input-group input {
        padding: 12px 15px 12px 45px;
      }
    }
  </style>
</head>
<body>
  <div class="wave-bg"></div>
  
  <div class="login-container">
    <div class="logo">
      <img src="RESİMLER/2.png" alt="AYBİS Logo">
    </div>
    
    <h2>Giriş Yap</h2>
    
    <form id="loginForm">
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" placeholder="E-posta Adresi" required>
      </div>
      
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" placeholder="Şifre" required>
      </div>
      
      <div class="options">
        <div class="remember-me">
          <input type="checkbox" id="remember">
          <label for="remember">Beni Hatırla</label>
        </div>
        <div class="forgot-password">
          <a href="#">Şifremi Unuttum?</a>
        </div>
      </div>
      
      <button type="submit" class="login-btn">Giriş Yap</button>
      
      <div class="divider">veya</div>
      
      <div class="social-login">
        <a href="#" class="social-btn google">
          <i class="fab fa-google"></i>
        </a>
        <a href="#" class="social-btn facebook">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="#" class="social-btn twitter">
          <i class="fab fa-twitter"></i>
        </a>
      </div>
      
      <div class="register-link">
        Hesabınız yok mu? <a href="register.html">Kayıt Olun</a>
      </div>
    </form>
  </div>

  <script>
   // Form gönderimi
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const submitBtn = this.querySelector('.login-btn');
  const originalText = submitBtn.innerHTML;
  
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Giriş Yapılıyor...';
  submitBtn.disabled = true;
  
  // Simüle edilmiş giriş işlemi
  setTimeout(() => {
    submitBtn.innerHTML = '<i class="fas fa-check"></i> Giriş Başarılı!';
    
    // Yönlendirme
    setTimeout(() => {
      window.location.href = 'AYBİS.html';
    }, 800);
  }, 1500);
});

// Input focus efektleri
document.querySelectorAll('.input-group input').forEach(input => {
  input.addEventListener('focus', function() {
    this.parentElement.querySelector('i').style.color = 'var(--accent)';
  });
  
  input.addEventListener('blur', function() {
    this.parentElement.querySelector('i').style.color = 'var(--primary)';
  });
});

   
  </script>
</body>
</html>
